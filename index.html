<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>News App</title>
    <!-- style link -->
    <link rel="stylesheet" href="style.css" />
    <!-- remax icon link -->
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- header section start  -->
    <header>
      <h1>News App</h1>
      <div class="search">
        <input type="text" id="searchInput" placeholder="Search news..." />
        <button type="button"><i class="ri-search-2-line"></i></button>
      </div>
    </header>
    <!-- header section end  -->
    <!-- slider section start -->
    <section class="slider">
      <div class="slider-container">
        <div class="slider-image-box">
          <img src="./images/pexels-cottonbro-3944454.jpg" alt="slider image" />
          <div class="overlay"></div>
        </div>
        <div class="slider-content">
          <h1>News Title</h1>
          <p>
            Lorem ipsum dolor sit amet consectetur adipisicing <br />elit.
            Quisquam quod, voluptates, quae, quos quia
          </p>
          <a href="#">Read More</a>
        </div>
      </div>
    </section>
    <!-- slider section end -->

    <!-- news section start -->
    <div class="newsHeading">
      <h1>Latest News</h1>
      <div class="newsFilter">
        <ul>
          <li class="active"><button>All</button></li>
          <li><button>Technology</button></li>
          <li><button>Politics</button></li>
          <li><button>Sports</button></li>
          <li><button>World</button></li>
        </ul>
      </div>
    </div>
    <div id="news"></div>
  </body>
  <script src="script.js"></script>
</html>
